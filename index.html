<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frame Player">
<meta name="theme-color" content="#0a0a0c">
<title>影片播放器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --accent: #c8ff47;
    --accent2: #47d4ff;
    --text: #f0f0f4;
    --muted: #888899;
  }

  html, body {
    background: #000;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    height: 100%;
    overflow: hidden;
    position: fixed;
    width: 100%;
  }

  /* ══ UPLOAD SCREEN ══ */
  #upload-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    gap: 24px;
    padding: 32px;
    background: #0a0a0c;
  }
  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .upload-zone {
    width: 100%; max-width: 340px;
    aspect-ratio: 16/10;
    border: 1.5px dashed rgba(200,255,71,0.3);
    border-radius: 16px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background: linear-gradient(135deg, rgba(200,255,71,0.03), rgba(71,212,255,0.03));
    position: relative; overflow: hidden; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .upload-zone:active { border-color: var(--accent); background: rgba(200,255,71,0.07); }
  .upload-zone::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 120%, rgba(200,255,71,0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .upload-icon {
    width: 56px; height: 56px; border-radius: 14px;
    background: rgba(200,255,71,0.1);
    display: flex; align-items: center; justify-content: center;
  }
  .upload-icon svg { width: 28px; height: 28px; stroke: var(--accent); }
  .upload-text { font-size: 15px; font-weight: 600; }
  .upload-sub { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; }
  #file-input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; z-index: 10; font-size: 16px;
  }

  /* ══ PLAYER SCREEN — true fullscreen ══ */
  #player-screen {
    display: none;
    position: fixed; inset: 0;
    background: #000;
  }

  #video-container {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    overflow: hidden;
    touch-action: none;
  }
  #video {
    width: 100%; height: 100%;
    display: block; object-fit: contain;
    transform-origin: center center;
    transition: none;
    will-change: transform;
  }

  /* Tap zone over video */
  #tap-overlay {
    position: absolute; inset: 0;
    z-index: 5; cursor: pointer;
  }

  /* ── Time info top-right ── */
  #time-overlay {
    position: absolute;
    top: max(env(safe-area-inset-top, 0px), 8px);
    right: 12px;
    margin-top: 8px;
    background: transparent;
    padding: 5px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: rgba(255,255,255,0.75);
    letter-spacing: 0.05em;
    pointer-events: none;
    line-height: 1.7; text-align: right;
    z-index: 20;
    transition: opacity 0.3s;
  }
  #time-display { color: rgba(255,255,255,0.85); }
  #frame-display { color: rgba(255,255,255,0.5); font-size: 10px; }
  #time-overlay.hidden { opacity: 0; }

  /* ── Mini bar (visible when panel hidden) ── */
  #mini-bar {
    position: absolute;
    bottom: max(env(safe-area-inset-bottom, 0px), 10px);
    left: 0; right: 0;
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: space-around;
    background: transparent;
    border: none;
    padding: 6px 24px;
  }
  #mini-bar.show { display: flex; }

  .mini-btn {
    background: transparent;
    border: none;
    border-radius: 50%;
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    opacity: 0.7;
  }
  .mini-btn svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mini-btn:active { opacity: 1; transform: scale(0.88); }

  #mini-play-btn { opacity: 0.85; }
  #mini-play-btn svg { stroke: #fff; width: 28px; height: 28px; }

  .mini-divider { display: none; }

  #mini-expand {
    opacity: 0.35;
    font-size: 16px;
    color: #fff;
    padding: 0;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
  }

  /* ══ FLOATING CONTROLS PANEL ══ */
  #controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    z-index: 30;
    background: transparent;
    padding-top: 32px;
    padding-bottom: max(env(safe-area-inset-bottom, 0px), 6px);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s;
  }
  #controls.hidden {
    transform: translateY(100%);
    opacity: 0;
    pointer-events: none;
  }

  /* Hide chevron pill at top of panel */
  #hide-pill {
    display: flex; justify-content: center;
    margin-bottom: 2px;
  }
  #hide-pill button {
    background: transparent;
    border: none; border-radius: 100px;
    padding: 3px 22px; cursor: pointer;
    color: rgba(255,255,255,0.38); font-size: 16px; line-height: 1.3;
  }

  /* FPS row */
  #fps-row {
    display: flex; align-items: center;
    padding: 6px 12px 8px;
    border-bottom: none;
  }
  .fps-btns {
    display: flex; gap: 6px; flex: 1;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .fps-btns::-webkit-scrollbar { display: none; }
  .fps-btn {
    flex-shrink: 0; padding: 5px 10px;
    border-radius: 100px; border: 1.5px solid rgba(255,255,255,0.25);
    background: transparent; color: rgba(255,255,255,0.75);
    font-family: 'DM Mono', monospace; font-size: 13px;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .fps-btn.active {
    background: transparent;
    border-color: var(--accent2);
    color: var(--accent2); font-weight: 500;
  }
  .fps-btn:active { opacity: 0.7; transform: scale(0.95); }

  /* Speed row */
  #speed-row {
    display: flex; align-items: center;
    padding: 6px 12px 8px;
    border-bottom: none;
  }
  .speed-label {
    font-size: 11px; font-family: 'DM Mono', monospace;
    color: rgba(255,255,255,0.5); letter-spacing: 0.2em;
    text-transform: uppercase; margin-right: 10px; white-space: nowrap;
  }
  .speed-btns {
    display: flex; gap: 6px; flex: 1;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .speed-btns::-webkit-scrollbar { display: none; }
  .speed-btn {
    flex-shrink: 0; padding: 5px 11px;
    border-radius: 100px; border: 1.5px solid rgba(255,255,255,0.25);
    background: transparent; color: rgba(255,255,255,0.75);
    font-family: 'DM Mono', monospace; font-size: 13px;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .speed-btn.active {
    background: transparent; border-color: var(--accent);
    color: var(--accent); font-weight: 500;
  }
  .speed-btn:active { opacity: 0.7; transform: scale(0.95); }

  /* Playback row */
  #playback-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 10px 12px;
    border-bottom: none;
  }
  .ctrl-btn {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px;
    background: transparent;
    border: none;
    border-radius: 12px; padding: 10px 12px;
    cursor: pointer; transition: all 0.15s;
    flex: 1; max-width: 72px; min-height: 54px;
  }
  .ctrl-btn svg { width: 22px; height: 22px; stroke: rgba(255,255,255,0.85); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ctrl-btn span { font-size: 11px; font-family: 'DM Mono', monospace; color: rgba(255,255,255,0.6); letter-spacing: 0.05em; }
  .ctrl-btn:active { opacity: 0.6; transform: scale(0.95); }

  #play-btn {
    background: transparent; border: none;
    max-width: 80px; min-height: 60px;
  }
  #play-btn svg { stroke: #fff; width: 28px; height: 28px; }
  #play-btn span { color: rgba(255,255,255,0.6); font-size: 11px; }
  #play-btn:active { opacity: 0.7; transform: scale(0.95); }

  .save-btn svg { stroke: rgba(255,255,255,0.85); }

  /* Timeline */
  #timeline-section {
    padding: 8px 12px 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .timeline-label {
    font-size: 10px; font-family: 'DM Mono', monospace;
    color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase;
    display: flex; justify-content: space-between;
  }
  #progress-bar-wrap {
    position: relative; height: 4px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px; cursor: pointer;
  }
  #progress-fill {
    height: 100%; background: var(--accent);
    border-radius: 2px; width: 0%;
    transition: width 0.08s linear;
  }
  #thumbnail-strip {
    position: relative; height: 50px;
    border-radius: 8px; overflow: hidden;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
  }
  #thumb-canvas-strip {
    display: flex; height: 100%; width: 100%;
    position: absolute; top: 0; left: 0;
  }
  #thumb-canvas-strip canvas { flex-shrink: 0; height: 100%; object-fit: cover; }
  #timeline-indicator {
    position: absolute; top: 0; width: 2px; height: 100%;
    background: var(--accent); pointer-events: none;
    box-shadow: 0 0 6px var(--accent); z-index: 10;
  }
  #timeline-indicator::before {
    content: ''; position: absolute; top: -4px; left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 10px;
    background: var(--accent); border-radius: 50%;
  }
  .thumb-loading {
    color: var(--muted); font-size: 11px;
    font-family: 'DM Mono', monospace; text-align: center; padding: 8px 0 0;
  }

  /* Loop range */
  #loop-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px 8px;
  }
  /* ── Loop-row unified button style ── */
  #loop-set-in, #loop-set-out, #loop-clear, #loop-toggle,
  #auto-next-toggle, #loop-export, #loop-convert, #export-format {
    background: transparent; border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 100px; padding: 5px 10px;
    color: rgba(255,255,255,0.45); font-family: 'DM Mono', monospace;
    font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: all 0.15s; -webkit-appearance: none; appearance: none;
  }
  #loop-set-in:active, #loop-set-out:active, #loop-clear:active,
  #loop-toggle:active, #auto-next-toggle:active,
  #loop-export:active, #loop-convert:active { opacity: 0.6; }
  #loop-export:disabled { opacity: 0.3; cursor: not-allowed; }
  #export-format option { background: #1a1a1a; color: #fff; }
  /* activated states */
  #loop-set-in.set  { border-color: rgba(200,255,71,0.5); color: var(--accent); }
  #loop-set-out.set { border-color: rgba(200,255,71,0.5); color: var(--accent); }
  #loop-toggle.active      { border-color: var(--accent2); color: var(--accent2); }
  #auto-next-toggle.active { border-color: var(--accent2); color: var(--accent2); }
  #loop-export.active, #loop-convert.active { opacity: 0.6; }

  /* Export progress overlay */
  #export-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(0,0,0,0.85);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
  }
  #export-overlay.show { display: flex; }
  #export-overlay p {
    color: #fff; font-family: 'DM Mono', monospace;
    font-size: 14px; text-align: center; line-height: 1.6;
    padding: 0 24px;
  }
  #export-progress-bar {
    width: 240px; height: 6px;
    background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden;
  }
  #export-progress-fill {
    height: 100%; background: var(--accent);
    border-radius: 3px; width: 0%;
    transition: width 0.3s;
  }
  #export-cancel {
    background: transparent; border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 100px; padding: 7px 20px;
    color: rgba(255,255,255,0.6); font-family: 'DM Mono', monospace;
    font-size: 13px; cursor: pointer;
  }

  #loop-range-display {
    flex: 1; font-family: 'DM Mono', monospace; font-size: 10px;
    color: rgba(255,255,255,0.35); text-align: left; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }

  /* Range overlay on thumbnail strip */
  #loop-range-overlay {
    position: absolute; top: 0; height: 100%;
    background: rgba(200,255,71,0.15);
    border-left: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    pointer-events: none; z-index: 8;
    display: none;
  }
  #loop-range-overlay.show { display: block; }

  /* Toast */
  #toast {
    position: fixed; bottom: 50px; left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: rgba(15,15,22,0.92);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text); padding: 9px 18px;
    border-radius: 100px; font-size: 13px;
    font-family: 'DM Mono', monospace;
    opacity: 0; pointer-events: none;
    transition: all 0.25s; z-index: 9999; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #playlist-panel {
    max-height: 120px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 2px 12px 8px; border-top: 1px solid rgba(255,255,255,0.08);
    position: relative; z-index: 35;
  }
  .pl-header {
    font-family: 'DM Mono', monospace; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.18em;
    color: rgba(255,255,255,0.3); padding: 4px 0 2px;
  }
  #playlist-list { list-style: none; margin: 0; padding: 0; }
  #playlist-list .pl-item {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 0; cursor: pointer; font-family: 'DM Mono', monospace;
    font-size: 11px; color: rgba(255,255,255,0.65);
    -webkit-tap-highlight-color: rgba(200,255,71,0.12);
  }
  #playlist-list .pl-item.current { color: var(--accent2); }
  .pl-idx { width: 16px; text-align: right; opacity: 0.4; flex-shrink: 0; }
  .pl-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-del { flex-shrink: 0; font-size: 12px; opacity: 0.3; padding: 0 2px; color: #fff; }

#playlist-panel { max-height:120px; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 12px 8px; border-top:1px solid rgba(255,255,255,0.08); position:relative; z-index:35; }
.pl-header { font-family:'DM Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.18em; color:rgba(255,255,255,0.3); padding:4px 0 2px; }
#playlist-list { list-style:none; margin:0; padding:0; }
#playlist-list .pl-item { display:flex; align-items:center; gap:6px; padding:5px 0; cursor:pointer; font-family:'DM Mono',monospace; font-size:11px; color:rgba(255,255,255,0.65); }
#playlist-list .pl-item.current { color:var(--accent2); }
.pl-idx { width:16px; text-align:right; opacity:0.4; flex-shrink:0; }
.pl-name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pl-del { flex-shrink:0; font-size:12px; opacity:0.3; padding:0 4px; color:#fff; }
</style>

<script>
const pickBtn = document.getElementById('pick-btn');
const fileInput = document.getElementById('file-input');
const result = document.getElementById('result');
console.log('[TEST] script loaded');
pickBtn.addEventListener('click', () => {
  console.log('[TEST] pick button clicked');
  fileInput.click();
});
fileInput.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  console.log('[TEST] file change', f && f.name, f && f.size);
  result.textContent = f ? `selected: ${f.name}
size: ${f.size}` : 'no file';
});
</script>
</head>
<body>
  <div style="padding:24px;font-family:sans-serif;color:#fff;background:#111;min-height:100vh;">
    <button id="pick-btn" style="padding:12px 18px;font-size:16px;">選擇影片</button>
    <div id="result" style="margin-top:16px;font-size:14px;white-space:pre-wrap;"></div>
    <input type="file" id="file-input" accept="video/*" style="display:none;">
  </div>
</body>
</html>
